# HISTORICAL EXAMPLE ONLY: not registered in pack.yaml since 0.2.0.
# Incomplete sync primitive: does not enforce authority, person ownership or atomic current-organization updates.
# The old executor also treats now as a literal; do not invoke this as a business action.
action: TransferAssignment
version: 1
reversible: false
effects:
  - type: deleteLink
    linkType: AssignmentInOrganization
    linkId: params.oldLinkId
  - type: createLink
    linkType: AssignmentInOrganization
    from: assignment
    to: organization
    properties:
      startedAt: now
      reason: params.reason
