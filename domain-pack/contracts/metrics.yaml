# Business definition only; not a Foundry executable manifest.
schemaVersion: 1
status: "definition-only"
common:
  filters:
    - "timeRange"
    - "taskOwnerOrganization"
    - "recipientOrganizationSnapshot"
    - "currentOrganization"
    - "tagVersion"
    - "contentCategorySnapshot"
    - "taskId"
  output:
    - "value"
    - "numerator"
    - "denominator"
    - "unit"
    - "asOf"
    - "filters"
    - "definition"
    - "detailEntry"
  zeroDenominator: "null / 不适用，不返回0%冒充观测结果"
  missingInput: "unknown / 待同步，不假造0"
  privacy: "统计与下钻用同一权限范围，敏感字段仍脱敏"
  history: "业务阅读只查询当前发布版；旧版阅读走审计"
metrics:
  -
    code: "effectivePeople"
    grain: "PERSON"
    object: "Person"
    definition: "按人员ID去重，ACTIVE且ELIGIBLE；异常分维度另列，不将缺档案的人静默剔除"
    numerator: "count(Person)"
    denominator: "none"
    organizationBasis: "current organization"
  -
    code: "associationIssues"
    grain: "PERSON"
    object: "DataAssociationIssue"
    definition: "按有OPEN人员级身份/组织/档案异常的人员去重，同时返回各异常类型数，允许类型重叠"
    numerator: "distinct persons with OPEN issue"
    denominator: "none"
    organizationBasis: "current organization"
  -
    code: "nonObjectAccounts"
    grain: "ACCOUNT"
    object: "ObjectEligibility"
    definition: "当前NON_OBJECT对应账号数；另返回关联人员数，不与有效对象数直接相加"
    numerator: "distinct accounts with NON_OBJECT"
    denominator: "none"
    organizationBasis: "current organization"
  -
    code: "tagCoverage"
    grain: "PERSON"
    object: "PersonTagAssignment"
    definition: "人员存在ACTIVE逻辑标签且人员有效，多个来源/多个标签不重复累计"
    numerator: "distinct eligible active people with active tag"
    denominator: "effectivePeople"
    organizationBasis: "current organization"
  -
    code: "tagSourceDistribution"
    grain: "CONTRIBUTION"
    object: "TagContribution"
    definition: "RULE/MANUAL/AI_REVIEWED/STAGE贡献分类；另列各来源去重人数，来源人数可重叠"
    numerator: "active contributions by source"
    denominator: "none"
    organizationBasis: "source organization + current person organization"
  -
    code: "tagPending"
    grain: "PERSON_TAG"
    object: "TagCandidate"
    sourceObjects:
      - "TagCandidate"
      - "TagProcessingIssue"
      - "PersonTagAssignment"
    definition: "待复核、无法判断、调用失败、无法计算、人工抑制分别统计当前人员+标签项，并同时返回各类涉及的去重人数；同人多标签或多批次异常不能冒充多人。类别人数可重叠，历史已解决问题不计当前待处理。不能合并为整人同步异常。"
    numerator: "distinct current person-tag pairs by category/state; affectedPeople = distinct person IDs per category"
    counts:
      items: "PERSON_TAG"
      affectedPeople: "PERSON"
    denominator: "none"
    organizationBasis: "current organization"
  -
    code: "targetRecipients"
    grain: "TASK_PERSON"
    object: "RecipientRecord"
    definition: "跨任务为人次；单任务按稳定接收记录，不按版本重复计算。取当前有效审核/发布版本的VersionTargetsRecipient成员；历次驳回或撤回审核的历史接收名单不加入当前目标总数。"
    numerator: "count stable task-person members of the current effective snapshot"
    denominator: "none"
    organizationBasis: "task owner + recipient organization snapshot"
  -
    code: "deliveryRate"
    grain: "TASK_PERSON"
    object: "RecipientRecord"
    definition: "成功/失败/未知/已提交分别显示；重试不增加目标人数，已提交含得到结果的请求"
    numerator: "delivered stable records"
    denominator: "submitted stable records"
    organizationBasis: "task owner + recipient organization snapshot"
  -
    code: "readRateAmongDelivered"
    grain: "TASK_PERSON"
    object: "RecipientVersionState"
    definition: "只计当前发布版本；送达者阅读率分子必须同时满足已送达且已读"
    numerator: "delivered AND latest-version READ"
    denominator: "delivered stable records"
    organizationBasis: "task owner + recipient organization snapshot"
  -
    code: "readCoverageAmongTargets"
    grain: "TASK_PERSON"
    object: "RecipientVersionState"
    definition: "包含真实已读但送达回执未到的记录，另列对接不一致；避免出现阅读率>100%"
    numerator: "latest-version READ"
    denominator: "targetRecipients"
    organizationBasis: "task owner + recipient organization snapshot"
  -
    code: "overdueUnread"
    grain: "TASK_PERSON"
    object: "OverdueRecord"
    definition: "最新版本OPEN且仍UNREAD，有合法首次送达起点和已过截止；同时展示去重人数"
    numerator: "latest-version open overdue records"
    denominator: "none"
    organizationBasis: "current supervisor organization"
  -
    code: "integrationIssues"
    grain: "EVENT"
    object: "IntegrationIssue"
    definition: "身份、渠道、页面、正文、图片、回执不一致分别计数，失败重试次数与结果另列"
    numerator: "distinct issue event IDs by category"
    denominator: "none"
    organizationBasis: "authorized task and recipients"
