commonInput:
  commandId: "String"
  expectedVersions: "Map<ID,Int>"
  effectiveAt: "DateTime?"
  reason: "String?"
commonContext: "tenant/actor/currentOrganization/functional grants are authenticated server context, never trusted request fields; event callbacks use trusted source context"
actions:
  -
    name: "SynchronizeOrganizationFacts"
    source: "DXK_SJGL PLAN_GOVERNANCE"
    status: "definition-only"
    scope: "core"
    actor: "authority-connector"
    permission: "SOURCE_SYNC"
    objects:
      - "Organization"
      - "DataAssociationIssue"
    inputs:
      organizationId: "ID"
      sourceEventId: "String"
      sourceVersion: "String"
      effectiveAt: "DateTime"
      observedAt: "DateTime"
      facts: "JSON"
    rules:
      - "SOURCE"
      - "ORGANIZATION_AUTHORITY"
      - "IDENTITY"
      - "HISTORY"
      - "AUDIT"
      - "REFERENCES"
    preconditions:
      - "已认证组织权威来源，来源字段和版本可验证；不接受普通管理员伪造同步事件"
      - "parentId必须显式提供；null表示根，其余为同租户组织，不能自指或形成环"
    effects:
      - "独立创建或更新组织，即使组织尚无人员；保留稳定ID、来源版本和观察时间"
      - "原子结束旧OrganizationParent并建立新关系，记录业务生效时间和记录时间"
      - "缺父组织、循环或多父冲突时只记录组织级异常，不安装错误树、不扩大授权范围；来源修复后重新校验"
      - "有效组织变化使当前权限范围和单位性质继承重新计算，安排受影响规则重算"
      - "人员当前组织ID不被树调整偷偷改写；历史任务归属、名单与组织快照保持原值"
    idempotency: "tenant+authenticatedSource+sourceEventId; same event with different facts rejected"
    output:
      affectedIds: "ID[]"
      result: "JSON"
      recordedAt: "DateTime"
    event: "gov.object-library.SynchronizeOrganizationFacts"
    failure: "无可信来源则拒绝；无效组织关系保留诊断，不提交部分树变更；允许修复后用新来源版本重试"
