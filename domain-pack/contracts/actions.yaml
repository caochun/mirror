      - "账号停用、授权撤销或单位变更后，下一次操作按最新事实验权，不能沿用旧会话权限"
      - "审核独立性和当前本级范围仍逐次校验；历史创建/审核身份及操作单位不改写"
    idempotency: "tenant+authenticatedSource+sourceEventId; same event with different facts rejected"
