# Business definition only; not a Foundry executable manifest.
schemaVersion: 1
status: "definition-only"
models:
  -
    object: "TagProcessingIssue"
    field: "state"
    values: ["OPEN", "RESOLVED"]
    transitions:
      - {from: "OPEN", to: "RESOLVED", action: "ResolveTagProcessingIssue"}
      - {from: "OPEN", to: "RESOLVED", action: "ApplyRuleEvaluation"}
      - {from: "OPEN", to: "RESOLVED", action: "DeactivateTagRule"}
    notes: "规则停用关闭不再适用的问题，保留原始异常和关闭原因，不冒充源字段修正；再评估产生新问题。"
  -
    object: "TagRule"
    field: "status"
    values: ["DRAFT", "ACTIVE", "INACTIVE"]
    transitions:
      - {from: "DRAFT", to: "ACTIVE", action: "PublishRuleVersion"}
      - {from: "ACTIVE", to: "INACTIVE", action: "DeactivateTagRule"}
      - {from: "ACTIVE", to: "INACTIVE", action: "SetTagAvailability"}
      - {from: "INACTIVE", to: "ACTIVE", action: "PublishRuleVersion"}
    notes: "CreateTagRule建立DRAFT；规则替换保持ACTIVE并换当前版本，停用不改旧版本内容；再启用须新的预览与确认。"
  -
    object: "MappingImpactPreview"
    field: "state"
    values: ["QUEUED", "RUNNING", "COMPLETED", "STALE", "FAILED", "CONSUMED"]
    transitions:
      - {from: "QUEUED", to: "RUNNING", action: "PreviewClassificationMapping"}
      - {from: "RUNNING", to: "COMPLETED", action: "PreviewClassificationMapping"}
      - {from: "RUNNING", to: "FAILED", action: "PreviewClassificationMapping"}
      - {from: "RUNNING", to: "STALE", action: "PreviewClassificationMapping"}
      - {from: "COMPLETED", to: "STALE", action: "PreviewClassificationMapping"}
      - {from: "COMPLETED", to: "CONSUMED", action: "PublishClassificationMapping"}
    notes: "预览仅保存提案和证据，不改变生效配置；发布前即使状态仍COMPLETED也须复验摘要；消费与映射发布原子提交。"
  -
    object: "ClassificationMapping"
    field: "state"
    values: ["ACTIVE", "INACTIVE"]
    transitions:
      - {from: "ACTIVE", to: "INACTIVE", action: "PublishClassificationMapping"}
      - {from: "INACTIVE", to: "ACTIVE", action: "PublishClassificationMapping"}
    notes: "首次发布创建ACTIVE；同状态修改也生成版本，已使用映射不得物理删除。停用、恢复均绑定预览提案。"
  -
    object: "WithdrawalRecord"
    field: "state"
    values: ["REQUESTED", "RUNNING", "WITHDRAWN", "FAILED", "UNKNOWN"]
    transitions:
      - {from: "REQUESTED", to: "RUNNING", action: "DispatchReminderWithdrawal"}
      - {from: "REQUESTED", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "RUNNING", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "RUNNING", to: "FAILED", action: "RecordWithdrawalResult"}
      - {from: "RUNNING", to: "UNKNOWN", action: "RecordWithdrawalResult"}
      - {from: "FAILED", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "UNKNOWN", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "UNKNOWN", to: "FAILED", action: "RecordWithdrawalResult"}
    notes: "每次重试创建新撤回尝试；租约恢复复用原请求。成功为终态，迟到失败只保留事件不降级。"
  -
    object: "ReminderTask"
    field: "revisionState"
    values: ["NONE", "DRAFT", "PENDING_REVIEW", "REJECTED", "WITHDRAWN", "APPROVED"]
    transitions:
      - {from: "NONE", to: "DRAFT", action: "SaveReminderRevision"}
      - {from: "REJECTED", to: "DRAFT", action: "SaveReminderRevision"}
      - {from: "WITHDRAWN", to: "DRAFT", action: "SaveReminderRevision"}
      - {from: "DRAFT", to: "PENDING_REVIEW", action: "SubmitReminderRevision"}
      - {from: "PENDING_REVIEW", to: "REJECTED", action: "DecideReminderReview"}
      - {from: "PENDING_REVIEW", to: "WITHDRAWN", action: "WithdrawReminderReview"}
      - {from: "PENDING_REVIEW", to: "APPROVED", action: "DecideReminderReview"}
      - {from: "APPROVED", to: "NONE", action: "PublishReminderRevision"}
      - {from: "DRAFT", to: "WITHDRAWN", action: "RequestReminderWithdrawal"}
      - {from: "PENDING_REVIEW", to: "WITHDRAWN", action: "RequestReminderWithdrawal"}
      - {from: "APPROVED", to: "WITHDRAWN", action: "RequestReminderWithdrawal"}
      - {from: "DRAFT", to: "WITHDRAWN", action: "RetryWithdrawal"}
      - {from: "PENDING_REVIEW", to: "WITHDRAWN", action: "RetryWithdrawal"}
      - {from: "APPROVED", to: "WITHDRAWN", action: "RetryWithdrawal"}
      - {from: "DRAFT", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "PENDING_REVIEW", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "APPROVED", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
    notes: "修订流程与主任务送达汇总正交；NONE或缺省表示无活动修订，旧发布版持续可读直到新版本原子发布。"
  -
    object: "Organization"
    field: "status"
    values: ["ACTIVE", "INACTIVE"]
    transitions:
      - {from: "ACTIVE", to: "INACTIVE", action: "ApplySourceLifecycle"}
      - {from: "INACTIVE", to: "ACTIVE", action: "ApplySourceLifecycle"}
      - {from: "ACTIVE", to: "INACTIVE", action: "SynchronizeOrganizationFacts"}
      - {from: "INACTIVE", to: "ACTIVE", action: "SynchronizeOrganizationFacts"}
    notes: "独立组织来源更新或生命周期事件，不删除组织/关系历史；停用影响当前资格和授权。"
  -
    object: "UserAccount"
    field: "state"
    values: ["ACTIVE", "INACTIVE"]
    transitions:
      - {from: "ACTIVE", to: "INACTIVE", action: "SynchronizeAccountAuthority"}
      - {from: "INACTIVE", to: "ACTIVE", action: "SynchronizeAccountAuthority"}
    notes: "登录主体停用不等于人员停用；账号重新启用仍须检查当前有效授权。"
  -
    object: "AuthorityGrant"
    field: "state"
    values: ["ACTIVE", "REVOKED"]
    transitions:
      - {from: "ACTIVE", to: "REVOKED", action: "SynchronizeAccountAuthority"}
    notes: "撤销后再授予创建新授权事实；validFrom/validTo参与每次验权，时间过期不等待状态作业才生效。"
  -
    object: "Person"
    field: "status"
    values:
      - "ACTIVE"
      - "INACTIVE"
    transitions:
      -
        from: "ACTIVE"
        to: "INACTIVE"
        action: "ApplySourceLifecycle"
      -
        from: "INACTIVE"
        to: "ACTIVE"
        action: "ApplySourceLifecycle"
    notes: "身份缺失与资格单独表达；不混成状态枚举。停用保留历史。"
  -
    object: "ObjectEligibility"
    field: "state"
    values:
      - "ELIGIBLE"
      - "NON_OBJECT"
      - "PENDING"
    transitions:
      -
        from: "ELIGIBLE"
        to: "NON_OBJECT"
        action: "SetObjectEligibility"
      -
        from: "NON_OBJECT"
        to: "ELIGIBLE"
        action: "SetObjectEligibility"
      -
        from: "PENDING"
        to: "ELIGIBLE"
        action: "SetObjectEligibility"
    notes: "资格为本应用范围，不改变源账号；人员级身份不明确时PENDING。"
  -
    object: "TagDefinition"
    field: "status"
    values:
      - "DRAFT"
      - "ACTIVE"
      - "INACTIVE"
    transitions:
      -
        from: "DRAFT"
        to: "ACTIVE"
        action: "PublishTagDefinition"
      -
        from: "ACTIVE"
        to: "INACTIVE"
        action: "SetTagAvailability"
      -
        from: "INACTIVE"
        to: "ACTIVE"
        action: "SetTagAvailability"
    notes: "目录移动及版本变化不重建稳定ID；仅未引用叶节点可物理删除。"
  -
    object: "PersonTagAssignment"
    field: "state"
    values:
      - "ACTIVE"
      - "SUPPRESSED"
      - "EXPIRED"
    transitions:
      - {from: "ACTIVE", to: "EXPIRED", action: "DeactivateTagRule"}
      -
        from: "ACTIVE"
        to: "SUPPRESSED"
        action: "RemovePersonTag"
      -
        from: "EXPIRED"
        to: "SUPPRESSED"
        action: "RemovePersonTag"
      -
        from: "SUPPRESSED"
        to: "ACTIVE"
        action: "RestorePersonTag"
      -
        from: "EXPIRED"
        to: "ACTIVE"
        action: "AddPersonTag"
      -
        from: "ACTIVE"
        to: "EXPIRED"
        action: "ApplyRuleEvaluation"
      -
        from: "EXPIRED"
        to: "ACTIVE"
        action: "ApplyRuleEvaluation"
      -
        from: "ACTIVE"
        to: "EXPIRED"
        action: "EndMatterStage"
      -
        from: "ACTIVE"
        to: "EXPIRED"
        action: "SetTagAvailability"
      -
        from: "SUPPRESSED"
        to: "ACTIVE"
        action: "AddPersonTag"
      - {from: "ACTIVE", to: "EXPIRED", action: "EndMatterParticipation"}
      - {from: "EXPIRED", to: "ACTIVE", action: "AssignStageTag"}
      - {from: "EXPIRED", to: "ACTIVE", action: "ReviewTagCandidate"}
    notes: "只有无抑制且存在有效贡献时ACTIVE；旧REMOVED迁移为SUPPRESSED。规则、AI和来源启用不能解除抑制。"
  -
    object: "TagContribution"
    field: "state"
    values:
      - "ACTIVE"
      - "EXPIRED"
    transitions:
      - {from: "ACTIVE", to: "EXPIRED", action: "DeactivateTagRule"}
      -
        from: "ACTIVE"
        to: "EXPIRED"
        action: "ApplyRuleEvaluation"
      -
        from: "ACTIVE"
        to: "EXPIRED"
        action: "EndMatterStage"
      - {from: "ACTIVE", to: "EXPIRED", action: "EndMatterParticipation"}
    notes: "来源贡献独立于逻辑标签，规则再次命中可建新的来源发生记录；历史贡献不改写。"
  -
    object: "TagEvaluation"
    field: "state"
    values:
      - "MATCH"
      - "SKIPPED"
      - "NO_MATCH"
      - "UNKNOWN"
      - "FAILED"
    transitions: []
    notes: "每次评估是不可变事实；重试产生新评估关联原批次或重试批次。"
  -
    object: "TagCandidate"
    field: "state"
    values:
      - "PENDING"
      - "APPROVED"
      - "REJECTED"
      - "STALE"
    transitions:
      -
        from: "PENDING"
        to: "APPROVED"
        action: "ReviewTagCandidate"
      -
        from: "PENDING"
        to: "REJECTED"
        action: "ReviewTagCandidate"
      -
        from: "PENDING"
        to: "STALE"
        action: "ReviewTagCandidate"
    notes: "过期输入需重评；已批准记录不再重新批准。"
  -
    object: "TagBatch"
    field: "state"
    values:
      - "QUEUED"
      - "RUNNING"
      - "SUCCEEDED"
      - "PARTIAL_FAILED"
      - "FAILED"
    transitions:
      -
        from: "RUNNING"
        to: "SUCCEEDED"
        action: "CompleteTagBatch"
      -
        from: "RUNNING"
        to: "PARTIAL_FAILED"
        action: "CompleteTagBatch"
      -
        from: "RUNNING"
        to: "FAILED"
        action: "CompleteTagBatch"
      - {from: "QUEUED", to: "RUNNING", action: "StartTagBatch"}
    notes: "作业生命周期交由执行层实现；批次完成不代表全部标签生效，人工抑制仍有效。"
  -
    object: "MatterParticipation"
    field: "state"
    values: ["ACTIVE", "ENDED"]
    transitions:
      - {from: "ACTIVE", to: "ENDED", action: "EndMatterParticipation"}
      - {from: "ACTIVE", to: "ENDED", action: "EndMatterStage"}
    notes: "参与退出结束其贡献；EndMatterStage只有在参与覆盖的所有阶段结束时才结束参与，不影响同人其他参与。"
  -
    object: "SupervisionMatter"
    field: "state"
    values:
      - "PLANNED"
      - "ACTIVE"
      - "ENDED"
    transitions:
      -
        from: "PLANNED"
        to: "ACTIVE"
        action: "AdvanceMatterStage"
      -
        from: "ACTIVE"
        to: "ENDED"
        action: "EndMatterStage"
    notes: "所有阶段结束才结束事项；流程事件保留。"
  -
    object: "MatterStage"
    field: "state"
    values:
      - "PLANNED"
      - "ACTIVE"
      - "ENDED"
    transitions:
      -
        from: "ACTIVE"
        to: "ENDED"
        action: "EndMatterStage"
      -
        from: "PLANNED"
        to: "ACTIVE"
        action: "AdvanceMatterStage"
    notes: "按业务生效时间，开始前/进行中/结束后可设置阶段；参与角色独立留痕。"
  -
    object: "ReminderContent"
    field: "state"
    values:
      - "DRAFT"
      - "ENABLED"
      - "DISABLED"
    transitions:
      -
        from: "DRAFT"
        to: "ENABLED"
        action: "SetContentAvailability"
      -
        from: "ENABLED"
        to: "DISABLED"
        action: "SetContentAvailability"
      -
        from: "DISABLED"
        to: "ENABLED"
        action: "SetContentAvailability"
    notes: "只有ENABLED可新引用；已引用副本不受影响。"
  -
    object: "RecipientSelection"
    field: "state"
    values:
      - "DRAFT"
      - "CONFIRMED"
      - "FROZEN"
    transitions:
      -
        from: "DRAFT"
        to: "CONFIRMED"
        action: "ConfirmRecipientSelection"
      -
        from: "CONFIRMED"
        to: "DRAFT"
        action: "UpdateRecipientSelection"
      -
        from: "CONFIRMED"
        to: "FROZEN"
        action: "SubmitReminderReview"
    notes: "确认绑定摘要和revision；FROZEN只能通过新草稿/轮次重新选择，已发布任务修订不改名单。"
  -
    object: "SelectionEntry"
    field: "state"
    values:
      - "INCLUDED"
      - "EXCLUDED"
      - "INELIGIBLE"
    transitions: []
    notes: "包含条件与指定重叠计数；manualExcluded为持久选择意图，不被条件重算擦除。"
  -
    object: "ReviewRound"
    field: "state"
    values:
      - "PENDING"
      - "APPROVED"
      - "REJECTED"
      - "WITHDRAWN"
      - "EXPIRED"
    transitions:
      -
        from: "PENDING"
        to: "APPROVED"
        action: "DecideReminderReview"
      -
        from: "PENDING"
        to: "REJECTED"
        action: "DecideReminderReview"
      -
        from: "PENDING"
        to: "WITHDRAWN"
        action: "WithdrawReminderReview"
      -
        from: "PENDING"
        to: "EXPIRED"
        action: "ExpireReminderReview"
      - {from: "PENDING", to: "WITHDRAWN", action: "RequestReminderWithdrawal"}
      - {from: "PENDING", to: "WITHDRAWN", action: "RetryWithdrawal"}
      - {from: "PENDING", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
    notes: "终态不回退；修改或再次提交创建新round，保留旧快照。"
  -
    object: "ReminderTask"
    field: "state"
    values:
      - "DRAFT"
      - "PENDING_REVIEW"
      - "REJECTED"
      - "REVIEW_EXPIRED"
      - "APPROVED_WAITING"
      - "SENDING"
      - "ALL_SUCCESS"
      - "PARTIAL_FAILED"
      - "ALL_FAILED"
      - "CANCELLED"
      - "WITHDRAWING"
      - "WITHDRAWN"
      - "PARTIAL_WITHDRAWN"
      - "WITHDRAW_FAILED"
    transitions:
      -
        from: "DRAFT"
        to: "PENDING_REVIEW"
        action: "SubmitReminderReview"
      -
        from: "REJECTED"
        to: "DRAFT"
        action: "SaveReminderDraft"
      -
        from: "REVIEW_EXPIRED"
        to: "DRAFT"
        action: "SaveReminderDraft"
      -
        from: "PENDING_REVIEW"
        to: "DRAFT"
        action: "WithdrawReminderReview"
      -
        from: "PENDING_REVIEW"
        to: "REJECTED"
        action: "DecideReminderReview"
      -
        from: "PENDING_REVIEW"
        to: "APPROVED_WAITING"
        action: "DecideReminderReview"
      -
        from: "PENDING_REVIEW"
        to: "REVIEW_EXPIRED"
        action: "ExpireReminderReview"
      -
        from: "APPROVED_WAITING"
        to: "CANCELLED"
        action: "CancelScheduledReminder"
      -
        from: "APPROVED_WAITING"
        to: "SENDING"
        action: "DispatchReminder"
      -
        from: "SENDING"
        to: "ALL_SUCCESS"
        action: "RecordDeliveryReceipt"
      -
        from: "SENDING"
        to: "PARTIAL_FAILED"
        action: "RecordDeliveryReceipt"
      -
        from: "SENDING"
        to: "ALL_FAILED"
        action: "RecordDeliveryReceipt"
      -
        from: "PARTIAL_FAILED"
        to: "SENDING"
        action: "RetryFailedRecipients"
      -
        from: "ALL_FAILED"
        to: "SENDING"
        action: "RetryFailedRecipients"
      -
        from: "ALL_SUCCESS"
        to: "WITHDRAWING"
        action: "RequestReminderWithdrawal"
      -
        from: "PARTIAL_FAILED"
        to: "WITHDRAWING"
        action: "RequestReminderWithdrawal"
      -
        from: "ALL_FAILED"
        to: "WITHDRAWING"
        action: "RequestReminderWithdrawal"
      -
        from: "WITHDRAWING"
        to: "WITHDRAWN"
        action: "RecordWithdrawalResult"
      -
        from: "WITHDRAWING"
        to: "PARTIAL_WITHDRAWN"
        action: "RecordWithdrawalResult"
      -
        from: "WITHDRAWING"
        to: "WITHDRAW_FAILED"
        action: "RecordWithdrawalResult"
      -
        from: "PARTIAL_WITHDRAWN"
        to: "WITHDRAWING"
        action: "RetryWithdrawal"
      -
        from: "WITHDRAW_FAILED"
        to: "WITHDRAWING"
        action: "RetryWithdrawal"
      -
        from: "SENDING"
        to: "WITHDRAWING"
        action: "RequestReminderWithdrawal"
      - {from: "ALL_FAILED", to: "PARTIAL_FAILED", action: "RecordDeliveryReceipt"}
      - {from: "ALL_FAILED", to: "ALL_SUCCESS", action: "RecordDeliveryReceipt"}
      - {from: "PARTIAL_FAILED", to: "ALL_SUCCESS", action: "RecordDeliveryReceipt"}
      - {from: "WITHDRAW_FAILED", to: "PARTIAL_WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "WITHDRAW_FAILED", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "PARTIAL_WITHDRAWN", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "PARTIAL_WITHDRAWN", to: "WITHDRAWING", action: "RequestReminderWithdrawal"}
      - {from: "WITHDRAW_FAILED", to: "WITHDRAWING", action: "RequestReminderWithdrawal"}
    notes: "发布内容版本与发送汇总正交；修订不将已送达主任务改回DRAFT。公开最新内容由currentPublishedVersionId确定，待审修订由pendingVersionId确定。"
  -
    object: "ReminderTaskVersion"
    field: "state"
    values:
      - "DRAFT"
      - "FROZEN"
      - "APPROVED"
      - "PUBLISHED"
      - "SUPERSEDED"
    transitions:
      -
        from: "DRAFT"
        to: "FROZEN"
        action: "SubmitReminderReview"
      - {from: "DRAFT", to: "FROZEN", action: "SubmitReminderRevision"}
      -
        from: "FROZEN"
        to: "APPROVED"
        action: "DecideReminderReview"
      -
        from: "APPROVED"
        to: "PUBLISHED"
        action: "DispatchReminder"
      -
        from: "APPROVED"
        to: "PUBLISHED"
        action: "PublishReminderRevision"
      -
        from: "PUBLISHED"
        to: "SUPERSEDED"
        action: "PublishReminderRevision"
    notes: "驳回/撤回留原冻结版本，修改生成新草稿版本；SUPERSEDED仅审计；每任务唯一当前发布版本。"
  -
    object: "ReminderSendJob"
    field: "state"
    values:
      - "QUEUED"
      - "RUNNING"
      - "SUCCEEDED"
      - "PARTIAL_FAILED"
      - "FAILED"
      - "CANCELLED"
    transitions: []
    notes: "批准后创建QUEUED，外部调用在提交之后执行；重试逐人，不覆盖任务快照。"
  -
    object: "RecipientRecord"
    field: "deliveryState"
    values:
      - "PENDING"
      - "SUBMITTED"
      - "DELIVERED"
      - "FAILED"
      - "UNKNOWN"
    transitions:
      -
        from: "PENDING"
        to: "SUBMITTED"
        action: "DispatchReminder"
      -
        from: "SUBMITTED"
        to: "DELIVERED"
        action: "RecordDeliveryReceipt"
      -
        from: "SUBMITTED"
        to: "FAILED"
        action: "RecordDeliveryReceipt"
      -
        from: "SUBMITTED"
        to: "UNKNOWN"
        action: "RecordDeliveryReceipt"
      -
        from: "UNKNOWN"
        to: "DELIVERED"
        action: "RecordDeliveryReceipt"
      -
        from: "FAILED"
        to: "SUBMITTED"
        action: "RetryFailedRecipients"
      -
        from: "UNKNOWN"
        to: "SUBMITTED"
        action: "RetryFailedRecipients"
      -
        from: "FAILED"
        to: "DELIVERED"
        action: "RecordDeliveryReceipt"
      -
        from: "UNKNOWN"
        to: "FAILED"
        action: "RecordDeliveryReceipt"
    notes: "DELIVERED为成功事实，不被迟到失败降级；sentAt旧字段映射firstDeliveredAt，不在修订时重置。"
  -
    object: "RecipientRecord"
    field: "withdrawalState"
    values:
      - "NONE"
      - "REQUESTED"
      - "WITHDRAWN"
      - "FAILED"
      - "UNKNOWN"
    transitions:
      -
        from: "NONE"
        to: "REQUESTED"
        action: "RequestReminderWithdrawal"
      -
        from: "REQUESTED"
        to: "WITHDRAWN"
        action: "RecordWithdrawalResult"
      -
        from: "REQUESTED"
        to: "FAILED"
        action: "RecordWithdrawalResult"
      -
        from: "REQUESTED"
        to: "UNKNOWN"
        action: "RecordWithdrawalResult"
      -
        from: "FAILED"
        to: "REQUESTED"
        action: "RetryWithdrawal"
      - {from: "FAILED", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "UNKNOWN", to: "WITHDRAWN", action: "RecordWithdrawalResult"}
      - {from: "UNKNOWN", to: "FAILED", action: "RecordWithdrawalResult"}
      -
        from: "UNKNOWN"
        to: "REQUESTED"
        action: "RetryWithdrawal"
    notes: "与送达和阅读独立；不删除原送达和阅读。"
  -
    object: "RecipientVersionState"
    field: "state"
    values:
      - "UNREAD"
      - "READ"
    transitions:
      -
        from: "UNREAD"
        to: "READ"
        action: "RecordFirstRead"
    notes: "新版新建UNREAD，旧版READ不改写；新版本可能在首次打开前已逾期。"
  -
    object: "OverdueRecord"
    field: "state"
    values:
      - "OPEN"
      - "RESOLVED"
      - "CLOSED"
    transitions:
      -
        from: "OPEN"
        to: "RESOLVED"
        action: "RecordFirstRead"
      -
        from: "OPEN"
        to: "CLOSED"
        action: "PublishReminderRevision"
      -
        from: "OPEN"
        to: "CLOSED"
        action: "RecordWithdrawalResult"
    notes: "只有真实阅读可RESOLVED；旧版本/撤回只能CLOSED并注明原因，不冒充已读。新版本超时另建OPEN。"
  -
    object: "IntegrationIssue"
    field: "state"
    values:
      - "OPEN"
      - "RESOLVED"
    transitions:
      -
        from: "OPEN"
        to: "RESOLVED"
        action: "ResolveIntegrationIssue"
      - {from: "OPEN", to: "RESOLVED", action: "RecordDeliveryReceipt"}
    notes: "记录恢复依据；技术恢复不自动改阅读状态。"
  -
    object: "AssistantActionCard"
    field: "state"
    values:
      - "PROPOSED"
      - "CONFIRMED"
      - "EXPIRED"
    transitions:
      -
        from: "PROPOSED"
        to: "CONFIRMED"
        action: "ConfirmAssistantAction"
      -
        from: "PROPOSED"
        to: "EXPIRED"
        action: "ExpireAssistantAction"
    notes: "确认仅传递条件；没有发送/批准能力，卡片过期不得确认。"
enforcement: "所有转换仍受actions和rules前置条件约束；ODL使用String兼容当前编译器，枚举/状态转换需要后续执行层校验，不能仅靠写state字段实现。"
