# Business definition only; not a Foundry executable manifest.
schemaVersion: 1
status: "definition-only"
note: "下列为业务验收规格，不声称生产处理器已实现；结构/模型测试另见business-verification。"
scenarios:
  -
    id: "S01"
    name: "局部缺失不否定整个人"
    given: "人员存在且组织唯一，但出生日期不可用"
    actions:
      - "SynchronizePersonFacts"
      - "ApplyRuleEvaluation"
      - "AddPersonTag"
    expect:
      - "年龄规则UNKNOWN并记局部问题"
      - "不依赖年龄的单位性质规则继续MATCH"
      - "人工赋标仍可执行；身份不可推送时单独限制正式名单"
  -
    id: "S02"
    name: "并行来源与人工抑制"
    given: "人员的同一标签有RULE、MANUAL两种有效贡献"
    actions:
      - "RemovePersonTag"
      - "ApplyRuleEvaluation"
      - "RestorePersonTag"
    expect:
      - "逻辑标签SUPPRESSED"
      - "规则再次MATCH只记录评估，不解除抑制"
      - "恢复后ACTIVE且原来源/来源组织历史保留"
  -
    id: "S03"
    name: "两事项阶段隔离"
    given: "同一人员参加A项目评标和B项目验收，共享一个专项标签定义"
    actions:
      - "RegisterSupervisionMatter"
      - "RegisterMatterParticipation"
      - "AssignStageTag"
      - "EndMatterStage"
    expect:
      - "建立A和B独立贡献"
      - "结束A阶段只结束A贡献"
      - "B贡献仍有效且逻辑标签仍ACTIVE，可追溯A已结束"
  -
    id: "S04"
    name: "非对象与停用"
    given: "有效人员已有标签和提醒历史"
    actions:
      - "SetObjectEligibility"
      - "ApplySourceLifecycle"
    expect:
      - "资格变NON_OBJECT或来源停用后禁止新赋标/AI/选人"
      - "对象及关系历史不删除"
      - "重新启用不解除人工抑制"
  -
    id: "S05"
    name: "候选不是有效标签"
    given: "AI配置已发布，候选输入资料已改变"
    actions:
      - "PublishAiPolicyVersion"
      - "StartTagBatch"
      - "RecordTagCandidate"
      - "ReviewTagCandidate"
    expect:
      - "发布本身不创建评估"
      - "未经确认不能用于正式筛选"
      - "过时建议STALE，不能直接批准生成有效标签"
  -
    id: "S06"
    name: "人工排除与重新确认"
    given: "多个组织及标签any条件命中P1/P2，手工指定P2/P3"
    actions:
      - "UpdateRecipientSelection"
      - "ConfirmRecipientSelection"
      - "UpdateRecipientSelection"
    expect:
      - "最终人员去重为P1/P2/P3"
      - "排除P2后条件重算仍不含P2"
      - "任何名单变化清除旧确认；单人必须定向确认"
  -
    id: "S07"
    name: "独立审核与过期"
    given: "单位A创建定时任务，审核员仅有A子单位范围"
    actions:
      - "SubmitReminderReview"
      - "DecideReminderReview"
      - "ExpireReminderReview"
    expect:
      - "无本级有效审核员不得提交"
      - "子单位审核员及创建人不能通过"
      - "计划时间已到尚未审核则EXPIRED，不迟到批准/补发"
  -
    id: "S08"
    name: "快照不可漂移"
    given: "引用内容v1并冻结人员名单，然后更名标签、修改示例、调动人员"
    actions:
      - "SaveReminderDraft"
      - "SubmitReminderReview"
      - "PublishTagDefinition"
      - "SaveContentExample"
      - "SynchronizePersonFacts"
    expect:
      - "任务仍保留当时内容/标签版本/组织分布"
      - "发送不得根据当前标签重算历史名单"
      - "旧单位任务查看权限与新单位人员权限分开判断"
  -
    id: "S09"
    name: "送达与阅读独立"
    given: "本人内容可访问但渠道回执结果UNKNOWN"
    actions:
      - "ReadOwnReminder"
      - "RecordFirstRead"
      - "RecordDeliveryReceipt"
    expect:
      - "有效正文阅读记READ并记录回执不一致"
      - "迟到送达成功不覆盖首次阅读"
      - "重复阅读不改变第一次时间，送达未知不能猜截止"
  -
    id: "S10"
    name: "新版不延长期限"
    given: "9月26日08:00首次送达，24小时期限为27日08:00，27日09:00发布修订"
    actions:
      - "SubmitReminderRevision"
      - "DecideReminderReview"
      - "PublishReminderRevision"
      - "EvaluateOverdue"
      - "RecordFirstRead"
    expect:
      - "接收记录ID、原名单、首次送达及截止不变"
      - "新版UNREAD立即满足逾期，旧版阅读仅审计"
      - "真实新版阅读解除新版逾期，不能由管理员代标"
  -
    id: "S11"
    name: "逐人失败与撤回"
    given: "任务三人，P1成功、P2失败、P3未知"
    actions:
      - "RetryFailedRecipients"
      - "RequestReminderWithdrawal"
      - "RecordWithdrawalResult"
      - "RetryWithdrawal"
    expect:
      - "发送重试仅P2/P3"
      - "撤回逐人登记结果，不能请求后即全部成功"
      - "成功撤回不能重复，失败/未知可重试；正文访问关闭后原历史仍在"
  -
    id: "S12"
    name: "H5异常与隐私"
    given: "短期本人会话已验证，正文成功但一张图片失败"
    actions:
      - "ReadOwnReminder"
      - "RecordIntegrationIssue"
      - "RecordFirstRead"
    expect:
      - "正文成功仍READ，单独记图片异常"
      - "正文失败不记READ、不自动重发"
      - "转发给其他人不能读；接口不返回内部标签/风险/审核/名单"
  -
    id: "S13"
    name: "AI动作卡只传条件"
    given: "超级管理员查询区镇无因事标签人员"
    actions:
      - "QueryAssistant"
      - "ProposeAssistantAction"
      - "ConfirmAssistantAction"
    expect:
      - "摘要带时间、组织、指标和明细入口"
      - "卡片只进入人工创建流程，不批准/发送"
      - "未知指标和廉洁指数排名拒绝，身份证手机始终脱敏"
  -
    id: "S14"
    name: "人数与人次"
    given: "P1收到两任务，P2收到一任务；一条记录已读但送达未知"
    actions:
      - "QueryBusinessMetrics"
    expect:
      - "目标3人次/2人，版本修订不增加人次"
      - "送达者阅读率仅计算已送达且已读，分子<=分母"
      - "全目标覆盖率可包含已读但送达未知，另外展示不一致"
  -
    id: "S15"
    name: "媒体和引用保护"
    given: "已发布任务引用内容v1与图片M1，草稿更换为M2"
    actions:
      - "RegisterMediaAsset"
      - "ConfirmReminderContent"
      - "SetContentAvailability"
      - "DeleteUnusedContent"
    expect:
      - "M1和已用示例不可物理删除"
      - "M2必须重新逐张确认，旧确认不复用"
      - "停用示例不覆盖历史任务正文"
  -
    id: "S16"
    name: "再次添加等于人工恢复"
    given: "当前标签SUPPRESSED且规则持续命中"
    actions:
      - "AddPersonTag"
      - "ApplyRuleEvaluation"
    expect:
      - "只有显式人工添加可解除抑制，来源贡献和原删除历史保留"
      - "后续规则评估不得把恢复的人工贡献结束"
  -
    id: "S17"
    name: "未知重试与迟到成功"
    given: "接收记录UNKNOWN，发起重试后收到前一次有效成功回执"
    actions:
      - "RetryFailedRecipients"
      - "RecordDeliveryReceipt"
    expect:
      - "UNKNOWN可重新提交，回执仍须匹配登记的尝试"
      - "可信首次成功可使FAILED或UNKNOWN进入DELIVERED，后续迟到失败不能覆盖成功"
  -
    id: "S18"
    name: "历史审计不绕过权限"
    given: "审核员知道他人任务ID，单位管理员知道兄弟单位人员ID"
    actions:
      - "ReadOperationAudit"
    expect:
      - "审核员仅本人审核事件"
      - "单位管理员不能利用历史对象ID读取跨范围事件"
      - "敏感值不因审计查看权限而自动解密"
  -
    id: "S19"
    name: "无人组织也可调整层级"
    given: "组织C尚无人员，原父组织A；已有任务保留A的组织快照"
    actions:
      - "SynchronizeOrganizationFacts"
      - "QueryBusinessMetrics"
    expect:
      - "无需创建虚构人员即可同步C，将C的当前父组织变为B"
      - "父关系旧值可按业务时间与记录时间追溯，历史任务快照不变"
      - "当前下级授权范围和单位性质继承重算；自指、环和缺父不产生扩权"
      - "组织异常可以在没有Person时通过IssueForOrganization保存"
  -
    id: "S20"
    name: "来源撤销权限即时生效"
    given: "管理员会话仍有效，授权来源撤销其标签写权限；审核员调到另一单位"
    actions:
      - "SynchronizeAccountAuthority"
      - "AddPersonTag"
      - "DecideReminderReview"
    expect:
      - "撤销后下一次写操作拒绝，重放旧命令也须重新验权"
      - "审核员不能继续审核原单位待审任务，原审核历史仍保留原操作单位"
      - "空授权快照结束该来源全部旧授权，不删除其他来源授权"
      - "停用登录账号与人员资格分别维护，不存密码、不自动把技术账号变为提醒对象"
  -
    id: "S21"
    name: "退出参与与跨阶段贡献隔离"
    given: "P在事项A两个阶段有参与贡献，在B另有参与；同事Q仍参与A"
    actions:
      - "EndMatterParticipation"
      - "EndMatterStage"
    expect:
      - "P退出A只结束P在该参与下的贡献，不影响Q或P在B的贡献"
      - "仅结束一个阶段不提前结束仍覆盖其他阶段的参与"
      - "无剩余有效贡献时逻辑标签EXPIRED，有其他贡献仍ACTIVE，人工SUPPRESSED保持不变"
      - "贡献人员与参与人员、事项与阶段不一致时拒绝写入"
  -
    id: "S22"
    name: "迟到回执修正汇总而不倒退撤回"
    given: "发送已结束且任务ALL_FAILED，随后收到可信首次成功；另一任务已进入撤回"
    actions:
      - "RecordDeliveryReceipt"
      - "RecordWithdrawalResult"
    expect:
      - "按实际逐人结果将ALL_FAILED修正为PARTIAL_FAILED或ALL_SUCCESS"
      - "迟到送达不把WITHDRAWING或WITHDRAWN任务改回发送状态"
      - "撤回失败或未知可被可信迟到成功修正，已撤回不被迟到失败降级"
  -
    id: "S23"
    name: "标签问题条数不冒充人数"
    given: "P有两个不同标签的无法计算问题，其中一个有两次失败批次；Q有一个问题"
    actions:
      - "QueryBusinessMetrics"
    expect:
      - "当前无法计算为3个人员标签项、2名涉及人员，不按历史批次累计为4项或4人"
      - "问题解决后从当前待处理计数移除，历史事件仍可审计"
  -
    id: "S24"
    name: "修订发布恢复与旧发送作业隔离"
    given: "任务已发布，另有尚未完成的原发送作业；修订已通过独立审核后服务中断"
    actions:
      - "SaveReminderRevision"
      - "ConfirmReminderContent"
      - "SubmitReminderRevision"
      - "DecideReminderReview"
      - "PublishReminderRevision"
      - "DispatchReminder"
    expect:
      - "修订只改变revisionState，原任务发送汇总与发布指针在审核前保持不变"
      - "重启根据持久批准记录发布一次，不新增接收人、不重置原截止、不重发成功者"
      - "旧发送作业恢复仍用其审核快照，但不得把当前发布指针改回已被替代的版本"
  -
    id: "S25"
    name: "在途发送与逐人撤回隔离"
    given: "P1已登记发送但渠道未处理，P2尚未登记，P3无需撤回"
    actions:
      - "DispatchReminder"
      - "RequestReminderWithdrawal"
      - "DispatchReminderWithdrawal"
      - "RecordWithdrawalResult"
    expect:
      - "P1必须按原请求标识撤回，渠道不能因暂未看到消息而伪报成功"
      - "P2可本地取消，不伪造送达或第三方响应；P3继续原发送作业"
      - "两人撤回不将三人任务汇总成全部撤回"
  -
    id: "S26"
    name: "撤回恢复、迟到回执和待发布修订"
    given: "渠道撤回已成功但本地尚未记回执，另有已批准未发布修订"
    actions:
      - "RequestReminderWithdrawal"
      - "DispatchReminderWithdrawal"
      - "RecordWithdrawalResult"
      - "RetryWithdrawal"
      - "PublishReminderRevision"
    expect:
      - "恢复复用原请求标识和首次渠道结果，成功者不重复撤回"
      - "消息撤回终止未发布修订，不能在撤回后被旧发布作业复活"
      - "迟到失败不降级成功，但原始失败回执保留在历史中"
  -
    id: "S27"
    name: "统计快照、权限与正确分母"
    given: "单位A两条提醒接收记录，其中一条已读但送达未知；操作者只获A及下级范围"
    actions:
      - "QueryBusinessMetrics"
      - "RecordFirstRead"
      - "SynchronizePersonFacts"
    expect:
      - "送达者阅读率分子只含送达且读，零分母为不适用；全目标覆盖率可含送达未知已读"
      - "同次明细使用同一统计快照和范围，重复任务按人次，另列去重人数"
      - "权限/人员归属变化后拒绝旧快照，不能利用缓存跨范围；不输出敏感原值"
  -
    id: "S28"
    name: "历史逐人标签筛选与记录来源"
    given: "任务两人，发送时只有P1带标签T v1，之后T更名或被人工抑制"
    actions:
      - "SubmitReminderReview"
      - "PublishTagDefinition"
      - "RemovePersonTag"
      - "QueryBusinessMetrics"
    expect:
      - "按发送时T v1筛选只得到P1，不把整份任务名单算作该标签接收人"
      - "任务修订保留原逐人标签依据；旧记录缺依据标未知，不用今天的标签回填"
      - "Mock记录明确标识；自动规则/AI未产生记录不等于无业务问题"
