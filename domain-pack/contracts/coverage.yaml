nonObjectRequirements:
  -
    source: "4、7、8、9.2"
    responsibility: "应用部署/性能/安全验收"
    requirements: "并发10、5万级分页、万级发送分批<=500、2/3/5秒及各验收响应时间、72小时运行与99.9%可用性、国产环境、恢复能力；由应用/平台验证，ODL不承诺已达标。不同章节查询时间阈值以更严格目标设计，验收统一确认。"
  -
    source: "3.5.6、4.6"
    responsibility: "接收端/适配层"
    requirements: "HTTPS、短期凭据、防重放、白名单暴露、富文本清洗、受控媒体；对象层提供证据和授权引用，不定义Nginx/服务器品牌。"
  -
    source: "试点方案附件1、附件3"
    responsibility: "权威档案/风险来源"
    requirements: "引用教育/履历/家庭档案及单位三定/班子等来源材料；不在对象库复制完整源系统。行权模型目录为风险来源，不要求本包实现全部监督模型。"
