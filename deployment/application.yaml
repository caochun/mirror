# Optional production overlay; load with --spring.config.additional-location=file:deployment/application.yaml
# Database endpoint and driver compatibility still require real target-environment verification.
server:
  address: ${MIRROR_BIND_ADDRESS:127.0.0.1}
  port: ${MIRROR_PORT:8080}
  servlet:
    session:
      cookie:
        secure: true
spring:
  datasource:
    url: ${MIRROR_JDBC_URL}
    username: ${MIRROR_JDBC_USERNAME}
    password: ${MIRROR_JDBC_PASSWORD}
mirror:
  dialect: ${MIRROR_DB_DIALECT:openGauss}
  pack: ${MIRROR_DOMAIN_PACK:./domain-pack}
  demo: false
